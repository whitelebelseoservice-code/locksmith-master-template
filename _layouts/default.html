<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>
    {% if page.title %}
      {{ page.title }} | {{ site.data.business.business_name }}
    {% else %}
      {{ site.data.business.business_name }}
    {% endif %}
  </title>

  <meta
    name="description"
    content="{{ page.description | default: site.description }}"
  >

  <link
    rel="stylesheet"
    href="{{ '/assets/css/style.css' | relative_url }}"
  >

  {% seo %}
</head>

<body>

  {% include navigation.html %}

  <main>
    {{ content }}
  </main>

</body>

</html>
