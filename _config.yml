title: "Locksmith Website"
description: "Professional locksmith services"
url: "https://whitebeleseoservice-code.github.io"
baseurl: "/locksmith-master-template"

markdown: kramdown
permalink: /blog/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag

collections:
  services:
    output: true
    permalink: /services/:name/

defaults:
  - scope:
      path: ""
    values:
      layout: "default"

  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

  - scope:
      path: ""
      type: "services"
    values:
      layout: "page"
